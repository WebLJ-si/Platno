services:
  platno:
    # `docker compose up -d --build` builds this checkout; `docker compose pull` uses a published image.
    image: ${PLEXV2_IMAGE:-weblj/platno:latest}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLEXV2_PORT:-8787}:8787"
    environment:
      SMART_MEDIA_COOKIE_SECURE: "${SMART_MEDIA_COOKIE_SECURE:-0}"
      # Optional: put temporary conversion files on a RAM disk or another volume (see the tmpfs below).
      # SMART_MEDIA_TRANSCODE_DIR: /transcode
      # Optional diagnostics for your own server: sends technical errors and a heartbeat to the collector
      # (see BETA.md and docs/deployment.md). Off unless both are set; SMART_MEDIA_TELEMETRY=off turns it off again.
      # SMART_MEDIA_RELEASE_CHANNEL: beta
      # SMART_MEDIA_TELEMETRY_ENDPOINT: https://platno-observatory.vercel.app/api/ingest
    volumes:
      - platno-data:/data
      - "${PLEXV2_MEDIA_DIR:?Set PLEXV2_MEDIA_DIR to your absolute media directory}:/media:ro"
    # tmpfs:
    #   - /transcode:size=4g,uid=10001
volumes:
  platno-data:
