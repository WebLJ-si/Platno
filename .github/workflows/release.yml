name: Release
# Publishes a release when a version tag such as v0.2.0 is pushed: programs for Linux (x86_64 and
# ARM64), macOS and Windows, .deb packages, checksums, the Docker image and detailed release notes.
# A tag containing a hyphen (v0.2.0-rc.1) is published as a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      stable: ${{ steps.v.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          base="${tag%%-*}"
          if [ "$base" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version" >&2; exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in *-*) echo "stable=false" >> "$GITHUB_OUTPUT" ;; *) echo "stable=true" >> "$GITHUB_OUTPUT" ;; esac

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.check.outputs.version }}

  image:
    needs: [check, build]
    uses: ./.github/workflows/image.yml
    secrets: inherit
    with:
      tags: ${{ needs.check.outputs.stable == 'true' && format('{0} latest', needs.check.outputs.version) || needs.check.outputs.version }}

  publish:
    needs: [check, build, image]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: |
          cp install.sh dist/install.sh
          python3 scripts/checksums.py dist
      - name: Write the release notes
        run: python3 scripts/release_notes.py "${{ needs.check.outputs.version }}" --repo "${{ github.repository }}" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          [ "${{ needs.check.outputs.stable }}" = "false" ] && flags="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Platno ${{ needs.check.outputs.version }}" --notes-file notes.md --verify-tag $flags
